<!DOCTYPE html>
<html>
<head>
    <title>HTML Media Basic Page</title>
</head>
<body>

    <h1>HTML 미디어 태그 실습</h1>

    <h2>1. 이미지</h2>

    <img src="https://picsum.photos/400/250" alt="실습 이미지">

    <h2>2. 오디오</h2>

    <audio controls>
        <source src="audio.mp3" type="audio/mpeg">
    </audio>

    <video controls width="400">
        <source src="video.mp4" type="video/mp4">
    </video>

</body>
</html>
