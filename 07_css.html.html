<!DOCTYPE html>
<html>
<head>
    <title>CSS Basic Page</title>

    <style>

        body {
            background-color: #f2f2f2;
        }

        h1 {
            color: navy;
            text-align: center;
        }

        .description {
            color: #555555;
            font-size: 18px;
        }

        #box {
            background-color: white;
            width: 400px;
            padding: 20px;
            margin: 30px auto;
            border: 2px solid navy;
            border-radius: 10px;
        }

    </style>
</head>

<body>

    <div id="box">

        <h1>CSS 실습</h1>

        <p class="description">
            HTML은 웹 페이지의 구조를 만들고,
            CSS는 웹 페이지의 디자인을 담당합니다.
        </p>

    </div>

</body>
