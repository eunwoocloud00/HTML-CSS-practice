<!DOCTYPE html>
<html>
<head>
    <title>HTML Table Colspan</title>
</head>
<body>

    <h1>HTML 표 병합 실습</h1>

    <table border="1">

        <tr>
            <th colspan="3">학생 정보</th>
        </tr>

        <tr>
            <th>이름</th>
            <th>학과</th>
            <th>학년</th>
        </tr>

        <tr>
            <td>수연</td>
            <td>실내건축</td>
            <td>3</td>
        </tr>

        <tr>
            <td>서연</td>
            <td>실내건축</td>
            <td>3</td>
        </tr>

    </table>

</body>
</html>
